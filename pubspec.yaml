name: weather_app
description: A weather application using Clean Architecture.
publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter


  #iOS style icons.
  cupertino_icons: ^1.0.2

  # State Management
  flutter_bloc: ^8.1.3

  # Networking
  dio: ^5.4.0

  # Dependency Injection
  get_it: ^7.6.7
  injectable: ^2.3.2

  # Routing
  go_router: ^13.2.0

  # Localization
  easy_localization: ^3.0.5

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # Utils
  dartz: ^0.10.1
  equatable: ^2.0.5
  internet_connection_checker: ^1.0.0+1
  json_annotation: ^4.8.1
  fluentui_system_icons: ^1.1.273

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

  build_runner: ^2.4.8
  injectable_generator: ^2.4.1
  json_serializable: ^6.7.1



flutter:

  uses-material-design: true

  assets:
    - assets/translations/
    - .env

  fonts:
    - family: Careem
      fonts:
        - asset: "assets/fonts/careem.otf"
        - asset: "assets/fonts/careem_bold.otf"
          weight: 700
